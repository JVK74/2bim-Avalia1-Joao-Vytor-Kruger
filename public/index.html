
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Desenho Assinado</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://accounts.google.com/gsi/client"
            async defer></script>

    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <header>
            <h1>Desenho Assinado</h1>
            <p>
                Entre com sua conta Google e escolha um número
                entre 1 e 100 para gerar sua figura.
            </p>
        </header>

        <div id="g_id_onload"
             data-client_id="320748226260-622n6l6kkl4acp1057h6mtrfvr7nd513.apps.googleusercontent.com"
             data-callback="handleGoogleCredential"
             data-auto_prompt="false">
        </div>

        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with">
        </div>

        <p id="loginStatus" role="status">
            Faça login com o Google para continuar.
        </p>

        <form id="formulario" novalidate>
            <label for="numero">Número</label>
            <input id="numero"
                   name="numero"
                   type="number"
                   min="1"
                   max="100"
                   step="1"
                   required
                   placeholder="42">

            <button type="submit">Gerar desenho</button>
        </form>

        <p id="mensagem" role="alert"></p>

        <figure id="desenho" aria-live="polite"></figure>

        <button id="baixar" type="button" hidden>
            Baixar SVG
        </button>
    </main>
</body>
</html>
