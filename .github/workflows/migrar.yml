name: Migrar D1

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'

permissions:
  contents: read

concurrency:
  group: migracoes-d1-main
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar migracoes no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: npx --yes wrangler@4 d1 migrations apply desenho-assinado-db --remote
