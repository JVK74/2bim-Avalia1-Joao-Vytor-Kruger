name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      
uses: actions/checkout@v6
      with:
        fetch-depth: 0

      
uses: actions/setup-node@v6
      with:
        node-version: 22

      
name: Instala o Copilot CLI
      run: npm install -g @github/copilot

      
name: Monta o prompt
      run: |{
          echo "Revise o diff de um site com Cloudflare Pages Functions e D1."
          echo "Aponte, em portugues e em ate 10 itens:"
          echo "1. Segredos expostos."
          echo "2. SQL montado por concatenacao em vez de prepare().bind()."
          echo "3. Erros de logica."
          echo '
diff'
          git diff "origin/${{ github.base_ref }}...HEAD" | head -c 20000
          echo
          echo '
'} > prompt.txt

      
name: Executa revisao por IA
      id: ia
      uses: actions/ai-inference@v1
      env:
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
      with:
        prompt-file: prompt.txt
        system-prompt: Voce e um revisor de codigo objetivo.

      
name: Comenta no Pull Request
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" --body-file "${{ steps.ia.outputs.response-file }}"
